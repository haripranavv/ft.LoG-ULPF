services:
  postgres:
    image: postgres:16-alpine
    container_name: ulpf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ulpf_db}
      POSTGRES_USER: ${POSTGRES_USER:-ulpf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulpf_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ulpf} -d ${POSTGRES_DB:-ulpf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ulpf-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulpf-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ulpf:ulpf_secure_password@postgres:5432/ulpf_db}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change_this_to_a_strong_password}
      - JWT_SECRET=${JWT_SECRET:-generate_a_random_secure_string_here}
      - JWT_EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS:-24}
      - RAW_STORAGE_DIR=/data/raw
      - AI_MODEL_PATH=/models/qwen2.5-3b-instruct-q4_k_m.gguf
      - ENABLE_LOCAL_AI=true
    volumes:
      - raw-storage:/data/raw
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ulpf-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulpf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - ulpf-network

volumes:
  postgres-data:
    driver: local
  raw-storage:
    driver: local

networks:
  ulpf-network:
    driver: bridge
