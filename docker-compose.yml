services:
  postgres:
    image: postgres:18
    container_name: ulpf-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ulpf
      POSTGRES_USER: ulpf
      POSTGRES_PASSWORD: ulpf_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulpf -d ulpf"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ulpf-network

  minio:
    image: minio/minio:latest
    container_name: ulpf-minio
    hostname: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ulpf
      MINIO_ROOT_PASSWORD: ulpf_minio_password
    volumes:
      - minio-data:/data
    networks:
      - ulpf-network

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: ulpf-flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
    volumes:
      - ./flink/src:/opt/ulpf/src
      - ./flink/lib:/opt/flink/lib/ulpf
      - ./backend:/opt/ulpf/backend
    networks:
      - ulpf-network

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    container_name: ulpf-flink-taskmanager
    hostname: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - TASK_MANAGER_NUMBER_OF_TASK_SLOTS=4
    networks:
      - ulpf-network
    volumes:
      - ./flink/src:/opt/ulpf/src
      - ./flink/lib:/opt/flink/lib/ulpf
      - ./backend:/opt/ulpf/backend

  kafka:
    image: apache/kafka:4.3.1
    container_name: ulpf-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ulpf-network

volumes:
  kafka-data:
  postgres-data:
  minio-data:

networks:
  ulpf-network:
    driver: bridge
